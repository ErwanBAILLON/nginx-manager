[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nginx-manager"
version = "2.0.0"
description = "Generate, validate and manage nginx virtual hosts safely (atomic writes, backups, nginx -t before enabling)."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Erwan Baillon" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["nginx", "reverse-proxy", "certbot", "devops", "cli"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ErwanBAILLON/nginx-manager"
Changelog = "https://github.com/ErwanBAILLON/nginx-manager/blob/main/CHANGELOG.md"

[project.scripts]
nginx-manager = "nginx_manager.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["nginx_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
